services:
  postgres:
    image: postgres:17
    container_name: cdc_postgres
    # wal_level=logical (and the sender/slot limits) are passed as server flags so the
    # container comes up ready for logical replication with no ALTER SYSTEM + restart.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_USER: cdc
      POSTGRES_PASSWORD: cdc
      POSTGRES_DB: cdc_demo
    ports:
      # Host 5433 to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      # Runs once on first init (empty data dir): creates the publication.
      - ./scripts/init_pg.sql:/docker-entrypoint-initdb.d/init_pg.sql:ro
      - cdc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdc -d cdc_demo"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Single-node Kafka in KRaft mode (no ZooKeeper) for the --sink kafka demo.
  kafka:
    image: apache/kafka:3.8.0
    container_name: cdc_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  cdc_pgdata:
